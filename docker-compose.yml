version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: identityguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-identityguard}
      POSTGRES_USER: ${POSTGRES_USER:-identityguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
